<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<title>ຮ້ານເຂົ້າກ່ອງ - ລະບົບບໍລິຫານ</title>
<style>
  :root { color-scheme: light only; --primary: #D85A30; --bg: #FAF7F2; --card: #ffffff; --border: #eee; --text: #2c2c2a; --red: #e24b4a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background-color: #FAF7F2 !important; color: #2c2c2a !important; font-family: sans-serif; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 16px; background-color: #FAF7F2; }
  .header { background: var(--primary); color: white; padding: 16px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
  .card { background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
  .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h2>🍱 ຮ້ານເຂົ້າກ່ອງ</h2>
    <p>ລະບົບບໍລິຫານຮ້ານ</p>
  </div>
  <div id="content" class="card">
    <h3 style="text-align:center; margin-bottom:12px;">ເຂົ້າສູ່ລະບົບ</h3>
    <input type="password" id="pinInput" placeholder="ໃສ່ລະຫັດຜ່ານ (1234)" />
    <button class="btn" onclick="checkPin()">ເຂົ້າສູ່ລະບົບ</button>
  </div>
</div>
<script>
  function checkPin() {
    var p = document.getElementById('pinInput').value;
    if(p === '1234' || p !== '') {
      document.getElementById('content').innerHTML = '<h3 style="color:green; text-align:center;">✅ ເຂົ້າສູ່ລະບົບສຳເລັດ!</h3><p style="text-align:center; margin-top:8px;">ລະບົບພ້ອມໃຊ້ງານແລ້ວ.</p>';
    } else {
      alert('ກະລຸນາໃສ່ລະຫັດຜ່ານ');
    }
  }
</script>
</body>
</html>
